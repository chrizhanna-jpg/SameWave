# Wave inbox: incoming Ripple card (both photos); tap opens full-screen Wave.
appId: echo.samewaveripple.app
---
- launchApp
- extendedWaitUntil:
    visible: "Waves"
    timeout: 60000
- tapOn: "Waves"
- extendedWaitUntil:
    visible:
      text: "Inbox|No incoming Ripples|Open Wave|Happy"
    timeout: 30000
- takeScreenshot: wave-inbox
- runFlow:
    when:
      visible: "Open Wave"
    commands:
      - tapOn: "Open Wave"
      - takeScreenshot: wave-inbox-fullscreen
