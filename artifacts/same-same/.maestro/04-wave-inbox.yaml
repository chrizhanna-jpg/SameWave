# Wave tab: Make a wave + Waves caught sections; tap opens full-screen Wave.
appId: echo.samewaveripple.app
---
- launchApp
- extendedWaitUntil:
    visible: "Waves"
    timeout: 60000
- tapOn:
    text: "Waves"
    index: 0
- extendedWaitUntil:
    visible: "Make a wave"
    timeout: 30000
- assertVisible: "Waves caught"
- takeScreenshot: wave-inbox-sections
- runFlow:
    when:
      visible: "Open Wave"
    commands:
      - tapOn: "Open Wave"
      - takeScreenshot: wave-inbox-fullscreen
